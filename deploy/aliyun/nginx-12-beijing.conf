server {
    listen 18081;
    server_name _;

    root /opt/12_beijing_aliyun;
    index index.html gis-platform.html;

    charset utf-8;
    client_max_body_size 20m;

    # Main static pages.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # GeoJSON / local data assets.
    location /data/ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
        types {
            application/json json geojson;
        }
    }

    # Common static assets if the project later adds css/js/img folders.
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|webp|ico|json|geojson|glb|gltf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
